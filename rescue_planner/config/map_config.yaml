# Instead of editing loco_nav/map_pkg/config/map_config.yaml, a copy
#  is kept in the project folder and read with the launch argument
#  map_env_params_file:=$(find rescue_planner)/config/map_config_ORIGINAL.yaml
#  It's already wired as the default in rescue_map.launch / benchmark.launch,
#  so nothing inside the submodule is modified.

/**/send_obstacles:
  ros__parameters:
    n_obstacles: 0                                # 0 => only the obstacles listed below (no random ones)
    no_cylinders: false                           # only affects RANDOM obstacles
    no_boxes: false                               # only affects RANDOM obstacles
    max_size: 1.0                                 # only affects RANDOM obstacles
    min_size: 0.5                                 # only affects RANDOM obstacles
    vect_type: ["box", "box", "cylinder", "cylinder", "box", "cylinder"]  # "box" or "cylinder"
    vect_x: [3.0, -3.0, 0.0, -4.0, 3.5, -2.5]               # X position of each obstacle
    vect_y: [3.0, 3.0, -2.0, -4.0, -2.0, 0.0]               # Y position of each obstacle
    vect_yaw: [0.0, 0.5, 0.0, 0.0, 0.0, 0.0]               # Yaw (rad); ignored for cylinders
    vect_dim_x: [1.0, 1.0, 1.0, 0.8, 1.0, 1.0]             # box width / cylinder size
    vect_dim_y: [1.0, 1.0, 1.0, 0.8, 1.0, 1.0]             # box height; ignored for cylinders

/**/send_gates:
  ros__parameters:
    use_namespace: false    # If true, one gate per Shelfino. Not yet implemented
    x: [-6.667334]               # X position of the gate(s)
    y: [-4.572347]              # NON-(0,0) => fixed gate; (0,0) => random gate on a border
    yaw: [3.665191]           # Yaw (rad) of the gate(s)

/**/send_victims:
  ros__parameters:
    victims_activated: true      # If true, victims are spawned
    n_victims: 0                 # 0 => only the victims listed below (no random ones)
    min_weight: 10               # only affects RANDOM victims
    max_weight: 500              # only affects RANDOM victims
    vect_x: [ 4.0,  -4.0,  2.0,  6.0,  6.0,  5.0, -5.0, -6.0, -2.0,  2.0,  0.0, -1.5,  3.5, -6.5,  7.0 ]
    vect_y: [ 0.0,   0.0,  6.0,  2.0, -2.0,  5.0,  5.0,  1.0, -6.0, -6.0,  4.0,  2.0, -4.5, -1.5,  0.0 ]
    vect_weight: [ 470,   200,  150,  350,  180,   90,  130,  160,  170,  140,  100,   80,  325,   95,  250 ]
    victims_timeout: 150   # Seconds to collect victims and reach the gate. 0 => auto

/**:
  ros__parameters:
    map: hexagon              # "hexagon" or "rectangle"
    dx: 10.0                    # hexagon edge length, or rectangle width
    dy: 20.0                    # rectangle height (unused for hexagon)
    max_timeout: 3              # NOT MAINTAINED
